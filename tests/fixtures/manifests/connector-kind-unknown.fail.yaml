# A Connector kind no installed distribution registers (friction 5).
schema_version: 1
target: {name: toy-order-desk}
adapter:
  kind: inprocess
  side_effects: none
  environments:
    default: local
    local:
      factory: agentdiag.examples.toy:make_target
      tools: agentdiag.examples.toy:make_tools
      model: claude-sonnet-5
connector:
  kind: bogus
  environments:
    local: {deployed: agentdiag.examples.toy:deployed_set}
judge_notes: judge_notes.md
suites:
  - suites/orders.yaml
