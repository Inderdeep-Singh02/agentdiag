# A continuer resumes a session already open with the continued Scenario's Fixtures; a
# different customer in the same chat is a Scenario error (decision 13).
schema_version: 1
target: toy-order-desk
fixtures:
  carmen: {kind: identity, name: Carmen}
  csaba: {kind: identity, name: Csaba}
scenarios:
  - id: ask-about-order
    title: Ask about an order
    fixtures: [carmen]
    turns: ["Where is NB-1042?"]
  - id: then-cancel-it
    title: Then cancel it in the same conversation
    continues: ask-about-order
    fixtures: [csaba]
    turns: ["Cancel it, please."]
