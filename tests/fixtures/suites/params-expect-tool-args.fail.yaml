# `validate` refuses expect_tool_args parameters that do not fit its typed params_model.
schema_version: 1
target: toy-order-desk
scenarios:
  - id: cancel-order
    title: Cancel an order
    turns: ["Cancel NB-1042, please."]
    evals:
      - expect_tool_args: {tool: lookup_order, args: {order_id: {equal: NB-1042}}}
