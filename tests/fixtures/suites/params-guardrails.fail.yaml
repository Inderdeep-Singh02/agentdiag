# `validate` refuses a guardrails key that is not `rules`.
schema_version: 1
target: toy-order-desk
evals:
  - guardrails:
      rules:
        - {id: G1, rule: Never cancel an order that has shipped.}
scenarios:
  - id: cancel-order
    title: Cancel an order
    turns: ["Cancel NB-1042, please."]
    evals:
      - guardrails: {rules: [G1], focus: G1}
