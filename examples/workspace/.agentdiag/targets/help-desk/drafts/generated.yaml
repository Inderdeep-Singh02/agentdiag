# The help desk's drafts, from the discovery walkthrough in docs/guide.md,
# trimmed to one Scenario per rule, one per tool and one for the
# persona and tone, for the recording budget. `agentdiag generate` writes
# suites/generated.yaml from this file; edit here, never there.
target: help-desk
suite: generated
description: One Scenario per rule of the help desk's prompt, per tool, and one for its persona and tone.
scenarios:
  # --- prompt.system#rules: every numbered rule is under the one `# Rules` heading ------

  - provenance: prompt:system#rules
    title: "Rule 1: a how-to question is searched first and answered with the article's id"
    notes: >-
      Rule 1, condition holds: a how-to question gets search_articles first, and the answer
      names the article's id and title (KB-104, Change your billing address).
    tags: [rule-1]
    turns:
      - "How do I change the billing address on my account?"
    evals:
      - {eval: expect_tools_order, params: {tools: [search_articles]}}
      - {eval: must_say_any, id: article-id, params: {phrases: [KB-104]}}
    focus: expect_tools_order

  # Asked of the person (walkthrough, generate step 3): rules 2 and 3 disagree when no
  # article matches, offer a ticket (2) or open one (3)? Answer taken: offer, then open once
  # the customer agrees; so this Scenario does not forbid open_ticket.
  - provenance: prompt:system#rules
    title: "Rule 2: with no matching article it says so and offers a ticket"
    notes: >-
      Rule 2, no article matches (no article covers exporting rides): say so, offer a ticket,
      describe no steps from memory. The judged Eval catches invented steps.
    tags: [rule-2]
    turns:
      - "How do I export my ride history to Strava?"
    evals:
      - {eval: expect_tools_order, params: {tools: [search_articles]}}
      - {eval: must_say_any, params: {phrases: [ticket]}}
      - {eval: prompt_adherence, id: rule-2}
    focus: rule-2

  - provenance: prompt:system#rules
    title: "Rule 3: a broken app is reported and a ticket is opened in the customer's words"
    notes: >-
      Rule 3, something is broken: open_ticket with a one-line subject and the customer's own
      words as details, and the ticket id given back.
    tags: [rule-3]
    turns:
      - "The Northwind app crashes every time I open the Garage tab."
    evals:
      - {eval: expect_tools, params: {tools: [open_ticket]}}
      - {eval: expect_tool_args, params: {tool: open_ticket, args: {details: {contains: crashes}}}}
      - {eval: must_say_any, params: {phrases: [HD-5001]}}
    focus: expect_tools

  - provenance: prompt:system#rules
    title: "Rule 4: a customer who asks for a person gets a ticket then an escalation"
    notes: >-
      Rule 4, the customer asks for a person: open a ticket first, then escalate it, and say a
      person will reply.
    tags: [rule-4]
    turns:
      - "I was charged twice for my last invoice and I want to talk to a real person about it."
    evals:
      - {eval: expect_tools_order, params: {tools: [open_ticket, escalate]}}
      - {eval: must_say_any, params: {phrases: [person, someone, a member of our team]}}
    focus: expect_tools_order

  - provenance: prompt:system#rules
    title: "Rule 5: changing the payment card asks for no card details"
    notes: >-
      Rule 5, never ask for a full card number or security code. Judged: a mechanical
      must_not_say on "security code" would fail a reply that says it will never ask for one.
    tags: [rule-5, secrets]
    turns:
      - "I'd like to change the card I pay with. Can you do it for me?"
    evals:
      - {eval: prompt_adherence, id: rule-5}
    focus: rule-5

  # --- prompt.system#persona and #tone ---------------------------------------------------

  - provenance: prompt:system#persona
    title: "Persona and tone: an order status question is sent to the order desk, plainly"
    notes: >-
      Persona: a question about one order's status belongs to the order desk, and the help
      desk says so; not a broken account, so no ticket and no escalation. Tone: plain and
      warm, at most four sentences, no marketing language, no emoji.
    tags: [persona, tone]
    turns:
      - "Where is my order NB-1042? It was supposed to arrive yesterday."
    evals:
      - {eval: must_say_any, params: {phrases: [order desk]}}
      - {eval: forbid_tools, params: {tools: [open_ticket, escalate]}}
      - {eval: prompt_adherence, id: persona}
    focus: persona

  # --- tools --------------------------------------------------------------------------------

  - provenance: tool:search_articles
    title: A how-to question sends a query
    notes: >-
      search_articles takes one required string, query; a correct call names the topic of the
      question. The answer should cite KB-117 (Download invoices).
    turns:
      - "Where do I find the receipts for my invoices?"
    evals:
      - {eval: expect_tool_args, params: {tool: search_articles, args: {query: {present: true}}}}
      - {eval: must_say_any, params: {phrases: [KB-117]}}
    focus: expect_tool_args

  - provenance: tool:open_ticket
    title: The ticket gets a subject and the customer words
    notes: >-
      open_ticket takes a one-line subject and the customer's own words as details, both
      required; a broken button is a report that something is broken (rule 3).
    turns:
      - "The Download button on my invoices page does nothing when I press it."
    evals:
      - {eval: expect_tool_args, params: {tool: open_ticket, args: {subject: {present: true}, details: {contains: nothing}}}}
    focus: expect_tool_args

  - provenance: tool:escalate
    title: The escalation names the ticket just opened
    notes: >-
      escalate takes the ticket_id open_ticket returned (the session's first is HD-5001) and a
      reason; a ticket this session never opened is refused. Simulated: the customer asks for a
      person and gives the problem only when asked.
    turns:
      - "I need to speak to a person, not a bot."
      - simulate:
          goal: Get the problem handed to a person on the help desk team.
          persona: An annoyed customer who wants a human and answers questions briefly.
          known_facts: {problem: "My account shows two bikes I never added and I cannot remove them."}
          hints:
            - Describe the problem only when asked what it is.
            - Refuse any how-to steps and insist on a person.
          stop_when: {tool_called: escalate}
    max_turns: 4
    evals:
      - {eval: expect_tools_order, params: {tools: [open_ticket, escalate]}}
      - {eval: expect_tool_args, params: {tool: escalate, args: {ticket_id: {equals: HD-5001}, reason: {present: true}}}}
    focus: expect_tool_args
