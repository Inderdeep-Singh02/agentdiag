[project]
name = "agentdiag"
version = "0.1.1"
description = "A profiler and evaluator for agentic systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Inderdeep Singh" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer",
    "anthropic>=1,<2",
    "pyyaml",
    "claude-agent-sdk>=0.2.158",
]

[project.urls]
Homepage = "https://github.com/Inderdeep-Singh02/agentdiag"
Changelog = "https://github.com/Inderdeep-Singh02/agentdiag/blob/main/CHANGELOG.md"

[project.scripts]
agentdiag = "agentdiag.cli:app"

# Adapter and Connector kinds, and Dialects, are found by entry point (ADR-0014 §2): core
# registers its own exactly as a plugin distribution registers a platform's.
[project.entry-points."agentdiag.adapters"]
inprocess = "agentdiag.adapter.inprocess:InProcessAdapter"
http = "agentdiag.adapter.http.session:HttpAdapter"

[project.entry-points."agentdiag.dialects"]
json = "agentdiag.adapter.http.dialects:JsonDialect"
sse-json = "agentdiag.adapter.http.dialects:SseJsonDialect"

[project.entry-points."agentdiag.connectors"]
inprocess = "agentdiag.connector.inprocess:InProcessConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdiag"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Prose is not code: `ruff format .` must never touch the fenced Python in a doc.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer declares a command's flags, help text and defaults in the signature, which is how
# `--help` is generated from it (D3). B008's "no call in a default" would move every one of
# them into a module constant and break the generated help.
"src/agentdiag/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/agentdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not live'"
markers = [
    "network: hits the network; deselected by default",
    "live: needs live model credentials; deselected by default",
]
